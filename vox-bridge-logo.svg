<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo oscuro -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A2442" />
      <stop offset="100%" stop-color="#090D1A" />
    </radialGradient>

    <!-- Gradiente vibrante para el puente de audio -->
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>
  </defs>

  <!-- Fondo redondeado estilo App/Favicon -->
  <rect width="512" height="512" rx="112" fill="url(#bg-glow)" />

  <!-- Indicador de Grabación (Recording Dot) -->
  <g id="recording-indicator">
    <circle cx="256" cy="65" r="8" fill="#FF007F" />
    <circle cx="256" cy="65" r="14" fill="none" stroke="#FF007F" stroke-width="2" opacity="0.4" />
  </g>

  <!-- Puente de Ondas de Audio (Wave Bridge) -->
  <g id="wave-bridge" fill="url(#wave-grad)">
    <!-- Lado Izquierdo -->
    <rect x="119" y="158" width="14" height="172" rx="7" />
    <rect x="145" y="138" width="14" height="137" rx="7" />
    <rect x="171" y="122" width="14" height="103" rx="7" />
    <rect x="197" y="110" width="14" height="75" rx="7" />
    <rect x="223" y="103" width="14" height="52" rx="7" />
    
    <!-- Centro -->
    <rect x="249" y="100" width="14" height="40" rx="7" />
    
    <!-- Lado Derecho -->
    <rect x="275" y="103" width="14" height="52" rx="7" />
    <rect x="301" y="110" width="14" height="75" rx="7" />
    <rect x="327" y="122" width="14" height="103" rx="7" />
    <rect x="353" y="138" width="14" height="137" rx="7" />
    <rect x="379" y="158" width="14" height="172" rx="7" />
  </g>

  <!-- Líneas de Transcripción (Texto debajo del puente) -->
  <g id="transcription-lines" fill="#FFFFFF" opacity="0.85">
    <rect x="220" y="190" width="72" height="8" rx="4" />
    <rect x="195" y="225" width="122" height="8" rx="4" />
    <rect x="170" y="260" width="172" height="8" rx="4" />
    <!-- Línea final simulando el fin de un párrafo -->
    <rect x="170" y="295" width="100" height="8" rx="4" />
  </g>

  <!-- Tipografía del Brand -->
  <g id="brand-text" font-family="Montserrat, system-ui, -apple-system, sans-serif" text-anchor="middle">
    <!-- Nombre Principal -->
    <text x="256" y="415" font-size="46" letter-spacing="1">
      <tspan font-weight="900" fill="#FFFFFF">VOX</tspan>
      <tspan font-weight="300" fill="#00E5FF"> BRIDGE</tspan>
    </text>
    
    <!-- Subtítulo -->
    <text x="256" y="455" font-size="14" font-weight="600" fill="#8B95AB" letter-spacing="5">
      AI TRANSCRIPTION
    </text>
  </g>
</svg>
